name: CI

on:
  push:
    branches: [dev, prod, 'feature/**']
  pull_request:
    branches: [dev, prod]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    name: frontend-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify Linux Node toolchain and install locked dependencies
        run: node --version && npm --version && npm ci
      - name: Type check, component tests and production build
        run: npm run typecheck && npm test && npm run build && npm run smoke
      - name: Build backend and verify real API client integration
        run: go build -C .. -o bin/shiny-tracker ./cmd/server && npm run test:integration
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - name: Verify browser startup and interactions
        run: npm run test:e2e

  go-checks:
    name: go-checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify Go toolchain
        run: go version && go env GOOS GOARCH
      - name: Download locked dependencies
        run: make deps
      - name: Check formatting, module consistency, vet, race tests and build
        run: make check
      - name: Test without race instrumentation
        run: go test ./...
      - name: Verify local backend process
        run: make smoke

  baseline-checks:
    name: baseline-checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Validate frozen baseline and task governance
        run: python scripts/validate_baseline.py
      - name: Verify governance rejection cases
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

  repository-hygiene:
    name: repository-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check whitespace against actual change base
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$PR_BASE_SHA" "$GITHUB_SHA"
          elif [[ "$GITHUB_REF" == refs/heads/feature/* ]]; then
            git diff --check origin/dev...HEAD
          elif [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            git diff --check "$BEFORE_SHA" "$GITHUB_SHA"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git show --format= --check HEAD
          fi
